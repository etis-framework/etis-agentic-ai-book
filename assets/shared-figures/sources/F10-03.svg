firm outcome or escalate</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="873.0" y="773.0">Never infer FAILED from timeout</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="570" y="828">An investigation retry is NOT a payment retry.</text></svg>