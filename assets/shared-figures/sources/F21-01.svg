<text x="570" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#20384a">PROTECTED ENFORCEMENT — no bypass from E3</text>
<text x="570" y="490" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#20384a">E1 admission  •  E4 information access  •  E5 authorization</text>
<text x="570" y="521" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#20384a">E6 credential custody and dispatch  •  E7 fenced operational state</text>
