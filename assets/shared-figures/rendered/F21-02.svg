<text x="570" y="626" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#20384a">Policy version • approval • test identity • deployment digest</text>
<text x="570" y="659" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20384a">RF-1042 intent and UNKNOWN outcome survive policy rollback</text>
