k</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="normal" text-anchor="middle" x="570" y="514">Errors · duplicates · disclosures · uncertain outcomes</text><rect fill="#F2F5F8" height="119" rx="19" ry="19" stroke="#203958" stroke-width="3" width="1056" x="42" y="585" /><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="bold" text-anchor="middle" x="570" y="632">Decision: pilot · keep baseline · stop</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="normal" text-anchor="middle" x="570" y="673">Hard constraints apply separately from expected net value</text><text fill="#485D71" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="normal" text-anchor="middle" x="570" y="761">Illustrative accounting model; not observed refund performance</text></svg>