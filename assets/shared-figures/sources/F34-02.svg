<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><rect x="0" y="0" width="1000" height="600" fill="#ffffff"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#163047} .t{font-size:25px;font-weight:700}.n{font-size:19px;font-weight:600}.s{font-size:15px}.box{fill:#EDF3F8;stroke:#57748A;stroke-width:2}.gate{fill:#E4F2ED;stroke:#267D67;stroke-width:2}.warn{fill:#FFF2E3;stroke:#A87533;stroke-width:2}.line{stroke:#38596C;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38596C"/></marker></defs><text class="t" x="500" y="48" text-anchor="middle">Higher autonomy is not automatically economical</text><rect class="box" x="45" y="105" width="280" height="96" rx="14"/><text class="n" x="185.0" y="141" text-anchor="middle">Case mix + outcome rate</text><text class="s" x="185.0" y="167" text-anchor="middle">same cohort across A / B / C</text><rect class="box" x="360" y="105" width="280" height="96" rx="14"/><text class="n" x="500.0" y="141" text-anchor="middle">Human review capacity</text><text class="s" x="500.0" y="167" text-anchor="middle">staffing + queue age</text><rect class="box" x="675" y="105" width="280" height="96" rx="14"/><text class="n" x="815.0" y="141" text-anchor="middle">Risk + recovery burden</text><text class="s" x="815.0" y="167" text-anchor="middle">uncertainty + incident cost</text><path class="line" d="M 185 201 L 185 278"/><path class="line" d="M 500 201 L 500 278"/><path class="line" d="M 815 201 L 815 278"/><rect class="gate" x="185" y="288" width="630" height="100" rx="14"/><text class="n" x="500.0" y="324" text-anchor="middle">Sensitivity analysis</text><text class="s" x="500.0" y="350" text-anchor="middle">unit cost + acceptable throughput + residual gaps</text><path class="line" d="M 500 388 L 500 447"/><rect class="warn" x="190" y="458" width="620" height="90" rx="14"/><text class="n" x="500.0" y="494" text-anchor="middle">Independent enforcement remains a hard gate</text><text class="s" x="500.0" y="520" text-anchor="middle">missing E5 proof cannot be offset by cheaper inference</text><text class="s" x="500" y="584" text-anchor="middle">Measure actual cohorts; illustrative numbers are not observed results.</text></svg>