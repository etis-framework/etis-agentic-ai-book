<svg xmlns="http://www.w3.org/2000/svg" width="5.75in" height="5.70in" viewBox="0 0 1140 1128"><rect width="1140" height="1128" fill="white"/><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#203958"/></marker><marker id="redarr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#B13C30"/></marker></defs><text x="570" y="45" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="bold" fill="#17314B">RECOVERY AFTER AN UNCERTAIN EFFECT</text><text x="570" y="78" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="normal" fill="#17314B">A response timeout is not a failed refund</text><rect x="400" y="115" width="340" height="77" rx="9" fill="#E8F1F9" stroke="#203958" stroke-width="2.5"/><text x="570" y="146" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="bold" fill="#17314B">Verify current owner</text><text x="570" y="175" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="bold" fill="#17314B">and RF-1042 identity</text><polygon points="570,250 750,345 570,440 390,345" fill="#FFF0CD" stroke="#203958" stroke-width="3"/><text x="570" y="333" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" fill="#17314B">Read-only status</text><text x="570" y="363" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" fill="#17314B">available?</text><path d="M570 192 L570 250" fill="none" stroke="#203958" stroke-width="3" marker-end="url(#arr)"/><path d="M750 345 L855 345" fill="none" stroke="#203958" stroke-width="3" marker-end="url(#arr)"/><text x="800" y="329" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#17314B">No</text><rect x="860" y="287" width="248" height="118" rx="9" fill="#FCEFEA" stroke="#203958" stroke-width="2.5"/><text x="984" y="326" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" fill="#17314B">Keep UNKNOWN</text><text x="984" y="356" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" fill="#17314B">Quarantine / escalate</text><path d="M570 440 L570 508" fill="none" stroke="#203958" stroke-width="3" marker-end="url(#arr)"/><text x="596" y="479" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#17314B">Yes</text><polygon points="570,508 775,616 570,724 365,616" fill="#FFF0CD" stroke="#203958" stroke-width="3"/><text x="570" y="603" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#17314B">Matching, sufficient</text><text x="570" y="634" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#17314B">provider evidence?</text><path d="M775 616 L855 616" fill="none" stroke="#203958" stroke-width="3" marker-end="url(#arr)"/><text x="808" y="598" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#17314B">No</text><rect x="860" y="557" width="248" height="118" rx="9" fill="#FCEFEA" stroke="#203958" stroke-width="2.5"/><text x="984" y="596" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" fill="#17314B">Remain UNKNOWN</text><text x="984" y="626" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" fill="#17314B">Escalate conflict</text><path d="M570 724 L570 793" fill="none" stroke="#203958" stroke-width="3" marker-end="url(#arr)"/><text x="596" y="764" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#17314B">Yes</text><rect x="365" y="793" width="410" height="116" rx="9" fill="#E7F4EB" stroke="#203958" stroke-width="2.5"/><text x="570" y="836" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="bold" fill="#17314B">Confirm original RF-1042</text><text x="570" y="867" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="bold" fill="#17314B">Record E7 / E9 evidence</text><rect x="90" y="971" width="960" height="92" rx="9" fill="#F1F4F7" stroke="#203958" stroke-width="2.5"/><text x="570" y="1006" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" fill="#17314B">Any NEW payment requires fresh independent E5 approval.</text><text x="570" y="1035" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" fill="#17314B">NOT_FOUND or timeout never permits automatic replay.</text></svg>