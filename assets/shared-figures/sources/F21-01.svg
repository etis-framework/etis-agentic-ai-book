<svg xmlns="http://www.w3.org/2000/svg" width="5.75in" height="4.200in" viewBox="0 0 1140 840">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#36596f"/></marker></defs>
<rect width="1140" height="840" fill="white"/>
<text x="570" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#20384a">Governance decisions require protected enforcement</text>
<text x="570" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20384a">Architecture mapping • not a prescribed service topology</text>
