<text x="944" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#20384a">3. Test</text>
<text x="944" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#20384a">Allow + deny cases</text>
<text x="944" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20384a">Replay + fault trials</text>
