<svg baseProfile="full" height="4.792in" version="1.1" viewBox="0 0 1140 950" width="5.75in" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="950" width="1140" x="0" y="0" /><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="bold" text-anchor="middle" x="570" y="50">Crash location changes the safe next action</text><rect fill="#EAF2FA" height="128" rx="14" ry="14" stroke="#203958" stroke-width="3" width="330" x="45" y="120" /><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="210.0" y="161.0">BEFORE DURABLE INTENT</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="210.0" y="192.0">No provider dispatch</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="210.0" y="223.0">Re-evaluate if needed</text><rect fill="#FFF0CC" height="128" rx="14" ry="14" stroke="#203958" stroke-width="3" width="330" x="405" y="120" /><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="570.0" y="161.0">INTENT, NOT DISPATCHED</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="570.0" y="192.0">Same RF-1042 record</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="570.0" y="223.0">Resume under controls</text><rect fill="#FBE8E6" height="128" rx="14" ry="14" stroke="#203958" stroke-width="3" width="330" x="765" y="120" /><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="930.0" y="161.0">AFTER DISPATCH</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="930.0" y="192.0">Outcome may be UNKNOWN</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="930.0" y="223.0">Never assume failure</text><polyline fill="none" points="210,248 210,328" stroke="#203958" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polygon fill="#203958" points="210,328 219.0,313.0 201.0,313.0" /><polyline fill="none" points="570,248 570,328" stroke="#203958" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polygon fill="#203958" points="570,328 579.0,313.0 561.0,313.0" /><polyline fill="none" points="930,248 930,328" stroke="#203958" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polygon fill="#203958" points="930,328 939.0,313.0 921.0,313.0" /><rect fill="#F2F5F8" height="139" rx="14" ry="14" stroke="#203958" stroke-width="3" width="330" x="45" y="328" /><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="210.0" y="374.5">NO FINANCIAL EFFECT</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="210.0" y="405.5">Local record absent</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="210.0" y="436.5">No blind replay</text><rect fill="#F2F5F8" height="139" rx="14" ry="14" stroke="#203958" stroke-width="3" width="330" x="405" y="328" /><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="570.0" y="374.5">CHECK CURRENT OWNER</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="570.0" y="405.5">Lease / epoch / authority</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="570.0" y="436.5">Dispatch same operation</text><rect fill="#E5F4EB" height="139" rx="14" ry="14" stroke="#203958" stroke-width="3" width="330" x="765" y="328" /><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="930.0" y="374.5">RECONCILE RF-1042</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="930.0" y="405.5">Provider status / ledger</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="930.0" y="436.5">Hold unsafe retries</text><rect fill="#FFF0CC" height="110" rx="14" ry="14" stroke="#203958" stroke-width="3" width="772" x="184" y="608" /><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="570.0" y="655.5">COMMON GUARANTEE BOUNDARY</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="570.0" y="686.5">Local durable intent does not prove external effect</text><polyline fill="none" points="210,467 210,558 385,558 385,608" stroke="#203958" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polygon fill="#203958" points="385,608 394.0,593.0 376.0,593.0" /><polyline fill="none" points="570,467 570,608" stroke="#203958" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polygon fill="#203958" points="570,608 579.0,593.0 561.0,593.0" /><polyline fill="none" points="930,467 930,558 760,558 760,608" stroke="#203958" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polygon fill="#203958" points="760,608 769.0,593.0 751.0,593.0" /><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="570" y="859">UNKNOWN is not FAILED. Confirmation needs provider evidence.</text></svg>