<text x="570" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20384a">Inference context / scratchpad</text>
<text x="570" y="341" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20384a">Derived case-memory summary</text>
<text x="570" y="373" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20384a">Advisory only; finite lifetime</text>

