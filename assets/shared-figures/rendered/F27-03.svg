<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="600px" version="1.1" viewBox="0 0 960 600" width="960px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="600" width="960" x="0" y="0" /><text fill="#203843" font-family="DejaVu Sans" font-size="25" font-weight="bold" text-anchor="middle" x="480" y="41">Decision path: ownership selects, E5 independently authorizes</text><text fill="#214B60" font-family="DejaVu Sans" font-size="19" text-anchor="middle" x="480" y="574">READY: one execute. UNKNOWN: status read only. A lease never grants payment authority.</text><rect fill="#E2EFF5" height="104" rx="12" ry="12" stroke="#A8BAC0" stroke-width="1.8" width="300" x="70" y="93" /><text fill="#203843" font-family="DejaVu Sans" font-size="21" font-weight="bold" text-anchor="middle" x="220.0" y="122">E2: verify lease</text><text fill="#203843" font-family="DejaVu Sans" font-size="20" text-anchor="middle" x="220.0" y="147">Worker / epoch / expiry</text><rect fill="#E4F3ED" height="104" rx="12" ry="12" stroke="#A8BAC0" stroke-width="1.8" width="330" x="540" y="93" /><text fill="#203843" font-family="DejaVu Sans" font-size="21" font-weight="bold" text-anchor="middle" x="705.0" y="122">E2: inspect phase</text><text fill="#203843" font-family="DejaVu Sans" font-size="20" text-anchor="middle" x="705.0" y="147">READY or unresolved?</text><line stroke="#214B60" stroke-width="2.5" x1="370" x2="539" y1="145" y2="145" /><polygon fill="#214B60" points="539,145 529.1434225272192,149.88342917662072 529.1434225272192,140.11657082337928" /><rect fill="#FDE9E5" height="105" rx="12" ry="12" stroke="#A8BAC0" stroke-width="1.8" width="260" x="50" y="310" /><text fill="#203843" font-family="DejaVu Sans" font-size="21" font-weight="bold" text-anchor="middle" x="180.0" y="339">INVALID / stale</text><text fill="#203843" font-family="DejaVu Sans" font-size="20" text-anchor="middle" x="180.0" y="364">Reject E2 mutation</text><rect fill="#E4F3ED" height="105" rx="12" ry="12" stroke="#A8BAC0" stroke-width="1.8" width="255" x="353" y="310" /><text fill="#203843" font-family="DejaVu Sans" font-size="21" font-weight="bold" text-anchor="middle" x="480.5" y="339">READY</text><text fill="#203843" font-family="DejaVu Sans" font-size="20" text-anchor="middle" x="480.5" y="364">Persist first intent</text><text fill="#203843" font-family="DejaVu Sans" font-size="20" text-anchor="middle" x="480.5" y="388">Then execute once</text><rect fill="#FFF2D9" height="105" rx="12" ry="12" stroke="#A8BAC0" stroke-width="1.8" width="260" x="661" y="310" /><text fill="#203843" font-family="DejaVu Sans" font-size="21" font-weight="bold" text-anchor="middle" x="791.0" y="339">UNRESOLVED</text><text fill="#203843" font-family="DejaVu Sans" font-size="20" text-anchor="middle" x="791.0" y="364">Status-only reconcile</text><text fill="#203843" font-family="DejaVu Sans" font-size="20" text-anchor="middle" x="791.0" y="388">Never execute again</text><line stroke="#214B60" stroke-width="2.5" x1="200" x2="180" y1="197" y2="309" /><polygon fill="#214B60" points="180,309 176.92531170269567,298.438452202711 186.5400763917119,300.1553744686068" /><line stroke="#214B60" stroke-width="2.5" x1="650" x2="480" y1="197" y2="309" /><polygon fill="#214B60" points="480,309 485.5441851819388,299.4993678805897 490.9174974409549,307.65528827373913" /><line stroke="#214B60" stroke-width="2.5" x1="750" x2="790" y1="197" y2="309" /><polygon fill="#214B60" points="790,309 782.0859443181429,301.3601228632611 791.2838041740005,298.0751729147405" /><rect fill="#F4F7F8" height="68" rx="12" ry="12" stroke="#A8BAC0" stroke-width="1.8" width="540" x="371" y="480" /><text fill="#203843" font-family="DejaVu Sans" font-size="21" font-weight="bold" text-anchor="middle" x="641.0" y="509">E5 independent financial gate</text><text fill="#203843" font-family="DejaVu Sans" font-size="20" text-anchor="middle" x="641.0" y="534">Verify scoped approval; preserve UNKNOWN</text><line stroke="#214B60" stroke-width="2.5" x1="480" x2="480" y1="415" y2="479" /><polygon fill="#214B60" points="480,479 475.1165708233793,469.14342252721923 484.8834291766207,469.14342252721923" /><line stroke="#214B60" stroke-width="2.5" x1="790" x2="790" y1="415" y2="479" /><polygon fill="#214B60" points="790,479 785.1165708233793,469.14342252721923 794.8834291766207,469.14342252721923" /></svg>