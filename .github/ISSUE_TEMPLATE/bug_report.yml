name: Companion bug report
description: Reproducible defect in the educational code or repository docs
body:
  - type: markdown
    attributes:
      value: "Do not disclose vulnerabilities, tokens, credentials, or personal data here. See SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Release/tag or commit
      placeholder: v1.1.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps and expected vs observed behavior
      description: Include host OS, Python version, exact command, sanitized output, and Docker/Compose versions and image architecture if applicable.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact on documented teaching claim
