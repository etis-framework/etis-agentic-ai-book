<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><rect width="1000" height="600" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#132c43} .h{font-size:24px;font-weight:bold}.t{font-size:21px;font-weight:bold}.s{font-size:19px}.xs{font-size:17px}.box{fill:#f2f6f8;stroke:#385973;stroke-width:2}.trust{fill:#e8f4ef;stroke:#176b54;stroke-width:3}.warn{fill:#fff5e5;stroke:#ac6b14;stroke-width:2}.arrow{stroke:#345b74;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#506a85;stroke-width:2;stroke-dasharray:8 5;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#345b74"/></marker></defs><text x="30" y="40" class="h">INCIDENT DISPOSITION  /  AUTHORITY BEFORE RESTART</text><rect x="335" y="72" width="330" height="65" rx="10" class="box"/><text x="349" y="101" class="t">Signal + preserve evidence</text><text x="349" y="127" class="s">E2 / E7 / E8 / E9 snapshots</text><path d="M500 140 L500 175" class="arrow"/><rect x="330" y="178" width="340" height="66" rx="10" class="warn"/><text x="344" y="207" class="t">Credential, E5 or owner risk?</text><text x="344" y="233" class="s">Independent trusted containment</text><path d="M330 209 H165 V269" class="arrow"/><text x="172" y="195" class="xs">YES</text><rect x="22" y="270" width="280" height="75" rx="10" class="warn"/><text x="36" y="299" class="t">SEV1  ·  QUARANTINE</text><text x="36" y="325" class="s">Security + incident command</text><path d="M500 245 L500 282" class="arrow"/><text x="515" y="269" class="xs">NO</text><rect x="333" y="284" width="335" height="68" rx="10" class="box"/><text x="347" y="313" class="t">E8 proof conclusive?</text><text x="347" y="339" class="s">Validate identity and finality</text><path d="M333 319 H319 V370 H165 V394" class="arrow"/><text x="306" y="305" class="xs">NO</text><rect x="22" y="395" width="285" height="82" rx="10" class="warn"/><text x="36" y="424" class="t">SEV2  ·  INQUIRE</text><text x="36" y="450" class="s">Recovery lead · deadline</text><path d="M500 352 L500 400" class="arrow"/><text x="518" y="386" class="xs">YES</text><rect x="360" y="404" width="300" height="75" rx="10" class="trust"/><text x="374" y="433" class="t">REVIEW · NO AUTO-CLOSE</text><text x="374" y="459" class="s">Finance owner verifies evidence</text><text x="320" y="515" class="s">No branch permits a second payment dispatch.</text><text x="23" y="568" class="s">E8 NOT_FOUND / outage / conflict never proves no effect; E5 epoch check still an open gate</text></svg>