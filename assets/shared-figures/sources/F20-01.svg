<text x="570" y="534" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20384a">Payment balance • shipment source facts • provider effect</text>
<text x="570" y="563" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20384a">Authenticated, scoped authoritative read; never a summary upgrade</text>
<text x="306" y="620" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#20384a">Independently validated fact read</text>

