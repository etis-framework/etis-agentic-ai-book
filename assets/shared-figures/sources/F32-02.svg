<path d="M647 176 L675 176" stroke="#334155" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
<path d="M820 231 L820 335" stroke="#334155" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
<path d="M675 394 L647 394" stroke="#334155" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
<path d="M355 394 L327 394" stroke="#334155" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
<rect x="35" y="541" width="930" height="42" rx="6" fill="#f1f5f9"/>
<text x="50" y="566" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#253b4f">Quarantine and restoration are trusted operational controls, not prompts to agents.</text></svg>