<svg xmlns="http://www.w3.org/2000/svg" width="5.75in" height="3.985in" viewBox="0 0 1140 790">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#31556B"/></marker></defs>
<rect x="0" y="0" width="1140" height="790" fill="#ffffff"/>
<text x="570" y="43" text-anchor="middle" fill="#12243A" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Accept a choice only with independent evidence</text>
<text x="570" y="78" text-anchor="middle" fill="#415164" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Business value and system assurance are separate gates</text>
<rect x="42" y="110" width="502" height="165" rx="13" fill="#E9F3F7" stroke="#2F475F" stroke-width="2"/>
<text x="293" y="149" text-anchor="middle" fill="#203349" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">BUSINESS VALUE GATE</text>
<text x="293" y="184" text-anchor="middle" fill="#203349" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Compare A / B / C with same cases</text>
<text x="293" y="218" text-anchor="middle" fill="#203349" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Quality • time • review • lifecycle cost</text>
<text x="293" y="250" text-anchor="middle" fill="#203349" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Reject when no demonstrated advantage</text>
<rect x="596" y="110" width="502" height="165" rx="13" fill="#FFF0D1" stroke="#946C2E" stroke-width="2"/>
<text x="847" y="149" text-anchor="middle" fill="#203349" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">SYSTEM ASSURANCE GATE</text>
<text x="847" y="184" text-anchor="middle" fill="#203349" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Scope • denials • E5 isolation</text>
<text x="847" y="218" text-anchor="middle" fill="#203349" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">UNKNOWN • reconciliation • recovery</text>
<text x="847" y="250" text-anchor="middle" fill="#203349" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Reject on bypass or lost ownership</text>
<line x1="293" y1="275" x2="293" y2="321" stroke="#31556B" stroke-width="3"  marker-end="url(#arr)"/>
<line x1="847" y1="275" x2="847" y2="321" stroke="#31556B" stroke-width="3"  marker-end="url(#arr)"/>
<rect x="155" y="333" width="830" height="87" rx="13" fill="#E5F1EB" stroke="#39765E" stroke-width="2"/>
<text x="570" y="364" text-anchor="middle" fill="#203349" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">PROVISIONAL ADR + ACCEPTANCE CRITERIA</text>
<text x="570" y="395" text-anchor="middle" fill="#203349" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Choice, alternatives, assumptions, reversal triggers</text>
<line x1="570" y1="420" x2="570" y2="467" stroke="#31556B" stroke-width="3"  marker-end="url(#arr)"/>
<rect x="295" y="478" width="550" height="87" rx="13" fill="#EDF4F7" stroke="#2F475F" stroke-width="2"/>
<text x="570" y="512" text-anchor="middle" fill="#203349" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">BOTH GATES SATISFIED?</text>
<text x="570" y="542" text-anchor="middle" fill="#203349" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Evidence includes negative and failure tests</text>
<path d="M295 519 H200 V602" fill="none" stroke="#31556B" stroke-width="3" marker-end="url(#arr)"/>
<path d="M845 519 H950 V602" fill="none" stroke="#31556B" stroke-width="3" marker-end="url(#arr)"/>
<text x="229" y="587" text-anchor="middle" fill="#945E22" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">NO</text>
<text x="911" y="587" text-anchor="middle" fill="#286354" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">YES</text>
<rect x="34" y="612" width="420" height="115" rx="13" fill="#FFF0D1" stroke="#946C2E" stroke-width="2"/>
<text x="244" y="646" text-anchor="middle" fill="#203349" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">HOLD / RESTRICT / REVERT</text>
<text x="244" y="675" text-anchor="middle" fill="#203349" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Investigate gaps; human ownership</text>
<text x="244" y="703" text-anchor="middle" fill="#203349" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Never bypass E5 or blind-retry</text>
<rect x="680" y="612" width="425" height="115" rx="13" fill="#E2F2EC" stroke="#39765E" stroke-width="2"/>
<text x="893" y="646" text-anchor="middle" fill="#203349" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">ACCEPT CONDITIONALLY</text>
<text x="893" y="675" text-anchor="middle" fill="#203349" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Release with monitoring and limits</text>
<text x="893" y="703" text-anchor="middle" fill="#203349" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Revisit on changed evidence</text>
<text x="570" y="772" text-anchor="middle" fill="#7A421C" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">A favorable model score cannot override a failed authority gate</text>
</svg>