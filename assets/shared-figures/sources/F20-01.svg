<text x="570" y="690" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#20384a">E5/E6 trusted effect boundary</text>
<text x="570" y="723" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20384a">Independent authorization • RF-1042 • controlled adapter dispatch</text>

<path d="M570 593 L570 650" stroke="#36596f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

<text x="570" y="810" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#20384a">Logical owners and access paths, not required separate services</text>
