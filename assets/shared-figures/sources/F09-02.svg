ica,sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="570" y="622">SCOPE CHANGE? TRUSTED REAUTHORIZATION</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="570" y="657">Rebind case, issue new version, fence stale scope</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="570" y="741">Reissue never grants payment authority; E5 remains separate.</text></svg>