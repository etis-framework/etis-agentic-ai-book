<text class="small" x="531" y="304" text-anchor="middle">Yes</text>
<rect x="305" y="322" width="390" height="70" rx="14" fill="#f0f6e8" stroke="#426b86" stroke-width="2"/>
<text class="label" x="500" y="352" text-anchor="middle">Reproducible + reviewed?</text>
