<svg baseProfile="full" height="420px" version="1.1" viewBox="0 0 900 420" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="420" width="900" x="0" y="0" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="bold" text-anchor="middle" x="450" y="43">Proposal is not permission · permission is not effect</text><rect fill="#eef4f6" height="120" rx="13" ry="13" stroke="#9eb7c0" stroke-width="2" width="230" x="30" y="100" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="145.0" y="151.0">1 · PROPOSE</text><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="145.0" y="185.0">What should happen?</text><rect fill="#eef4f6" height="120" rx="13" ry="13" stroke="#9eb7c0" stroke-width="2" width="230" x="335" y="100" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="450.0" y="151.0">2 · AUTHORIZE</text><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="450.0" y="185.0">May it happen?</text><rect fill="#eef4f6" height="120" rx="13" ry="13" stroke="#9eb7c0" stroke-width="2" width="230" x="640" y="100" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="755.0" y="151.0">3 · CONFIRM</text><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="755.0" y="185.0">What did happen?</text><line stroke="#255e72" stroke-dasharray="none" stroke-width="3" x1="260" x2="330" y1="160" y2="160" /><polygon fill="#255e72" points="330,160 317,153 317,167" /><line stroke="#255e72" stroke-dasharray="none" stroke-width="3" x1="565" x2="635" y1="160" y2="160" /><polygon fill="#255e72" points="635,160 622,153 622,167" /><rect fill="#fbf1dc" height="85" rx="13" ry="13" stroke="#9eb7c0" stroke-width="2" width="670" x="115" y="272" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="450.0" y="305.5">INDEPENDENT TRUST CHECKS</text><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" x="450.0" y="339.5">Reasoning ≠ authority ≠ observed outcome</text></svg>