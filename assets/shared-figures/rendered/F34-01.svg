<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><rect x="0" y="0" width="1000" height="600" fill="#ffffff"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#163047} .t{font-size:25px;font-weight:700}.n{font-size:19px;font-weight:600}.s{font-size:15px}.box{fill:#EDF3F8;stroke:#57748A;stroke-width:2}.gate{fill:#E4F2ED;stroke:#267D67;stroke-width:2}.warn{fill:#FFF2E3;stroke:#A87533;stroke-width:2}.line{stroke:#38596C;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38596C"/></marker></defs><text class="t" x="500" y="49" text-anchor="middle">What contributes to cost per acceptable case?</text><rect class="box" x="30" y="110" width="280" height="90" rx="14"/><text class="n" x="170.0" y="146" text-anchor="middle">Inference + context</text><text class="s" x="170.0" y="172" text-anchor="middle">model, retrieval, retries</text><rect class="box" x="360" y="110" width="280" height="90" rx="14"/><text class="n" x="500.0" y="146" text-anchor="middle">Independent controls</text><text class="s" x="500.0" y="172" text-anchor="middle">E5/E6, E7, evidence</text><rect class="box" x="690" y="110" width="280" height="90" rx="14"/><text class="n" x="830.0" y="146" text-anchor="middle">People + recovery</text><text class="s" x="830.0" y="172" text-anchor="middle">review, on-call, C08</text><path class="line" d="M 170 200 L 170 282"/><path class="line" d="M 500 200 L 500 282"/><path class="line" d="M 830 200 L 830 282"/><rect class="gate" x="180" y="292" width="640" height="92" rx="14"/><text class="n" x="500.0" y="328" text-anchor="middle">Full period lifecycle cost</text><text class="s" x="500.0" y="354" text-anchor="middle">operating + assurance + risk-response + exit expense</text><path class="line" d="M 500 384 L 500 430"/><rect class="warn" x="180" y="440" width="640" height="100" rx="14"/><text class="n" x="500.0" y="476" text-anchor="middle">Divide by acceptable completed workflows</text><text class="s" x="500.0" y="502" text-anchor="middle">documented outcomes, declared cohort + denominator</text><text class="s" x="500" y="577" text-anchor="middle">Never treat model calls, refund transfers or UNKNOWN as accepted outcomes.</text></svg>