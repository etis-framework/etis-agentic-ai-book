<text x="570" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#20384a">E1 admitted scope • E2 coordinator • E9 governance</text>
<text x="570" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20384a">Tenant, purpose, time, data classification, evidence retention</text>

<rect x="34" y="235" width="330" height="170" rx="10" fill="#e6eff6" stroke="#59748b" stroke-width="2"/>
