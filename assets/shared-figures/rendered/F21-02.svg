<text x="196" y="433" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#20384a">Detect rule drift</text>
<text x="196" y="466" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20384a">Contain + reconcile</text>
