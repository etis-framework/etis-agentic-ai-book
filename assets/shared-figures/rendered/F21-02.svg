<text x="570" y="433" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#20384a">Signed bundle + digest</text>
<text x="570" y="466" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20384a">Bound to E1/E5/E6</text>
<rect x="786" y="355" width="316" height="148" rx="11" fill="#eaf2f7" stroke="#59748b" stroke-width="2"/>
<text x="944" y="392" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#20384a">4. Authorize release</text>
<text x="944" y="433" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#20384a">Named approvers</text>
