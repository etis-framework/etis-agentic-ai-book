<rect width="1140" height="840" fill="white"/>
<text x="570" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#20384a">Policy change: controlled lifecycle and evidence</text>
