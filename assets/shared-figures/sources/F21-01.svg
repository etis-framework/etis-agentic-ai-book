<text x="304" y="652" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20384a">C04 cannot authorize or mint RF-1042</text>
<rect x="582" y="589" width="508" height="105" rx="11" fill="#fff0d8" stroke="#a98249" stroke-width="2"/>
<text x="836" y="621" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#20384a">E8 authoritative business facts</text>
<text x="836" y="652" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20384a">Validate before effect; reconcile outcome</text>
