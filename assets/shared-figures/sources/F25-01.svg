<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720"><rect width="1100" height="720" fill="white"/><text x="550" y="45" fill="#173b4b" font-family="Arial,sans-serif" font-weight="bold" font-size="28" text-anchor="middle">Build 3 — independent authority; durable intent before effect</text><rect x="38" y="97" width="273" height="85" rx="11" fill="#e7f2f8" stroke="#35677b" stroke-width="2.5"/><text x="174" y="130" fill="#173b4b" font-family="Arial,sans-serif" font-weight="bold" font-size="21" text-anchor="middle">E3 / C04 investigator</text><text x="174" y="158" fill="#173b4b" font-family="Arial,sans-serif" font-weight="normal" font-size="19" text-anchor="middle">Untrusted proposal</text><rect x="377" y="97" width="245" height="85" rx="11" fill="#e7f2f8" stroke="#35677b" stroke-width="2.5"/><text x="500" y="130" fill="#173b4b" font-family="Arial,sans-serif" font-weight="bold" font-size="21" text-anchor="middle">IPC client.py</text><text x="500" y="158" fill="#173b4b" font-family="Arial,sans-serif" font-weight="normal" font-size="19" text-anchor="middle">Request transport</text><rect x="691" y="97" width="367" height="85" rx="11" fill="#fff0d6" stroke="#35677b" stroke-width="2.5"/><text x="875" y="130" fill="#173b4b" font-family="Arial,sans-serif" font-weight="bold" font-size="22" text-anchor="middle">E5 service.py</text><text x="875" y="158" fill="#173b4b" font-family="Arial,sans-serif" font-weight="normal" font-size="19" text-anchor="middle">Verify identity + finance grant</text><path d="M311 139 L365.0 139.0" stroke="#35677b" stroke-width="3" fill="none" /><polygon points="377.0,139.0 365.0,144.0 365.0,134.0" fill="#35677b"/><path d="M622 139 L679.0 139.0" stroke="#35677b" stroke-width="3" fill="none" /><polygon points="691.0,139.0 679.0,144.0 679.0,134.0" fill="#35677b"/><rect x="38" y="271" width="530" height="92" rx="11" fill="#fae6e1" stroke="#35677b" stroke-width="2.5"/><text x="303" y="303" fill="#173b4b" font-family="Arial,sans-serif" font-weight="bold" font-size="22" text-anchor="middle">DENY: no independent grant</text><text x="303" y="332" fill="#173b4b" font-family="Arial,sans-serif" font-weight="normal" font-size="19" text-anchor="middle">No RF-1042, E7 intent or mock payment</text><path d="M691 175 L576.4 291.4" stroke="#a24736" stroke-width="3" fill="none" stroke-dasharray="8 7"/><polygon points="568.0,300.0 572.9,287.9 580.0,295.0" fill="#a24736"/><rect x="694" y="259" width="364" height="91" rx="11" fill="#e4f2e8" stroke="#35677b" stroke-width="2.5"/><text x="876" y="291" fill="#173b4b" font-family="Arial,sans-serif" font-weight="bold" font-size="22" text-anchor="middle">E7 durable intent</text><text x="876" y="321" fill="#173b4b" font-family="Arial,sans-serif" font-weight="normal" font-size="20" text-anchor="middle">prepare() records RF-1042</text><path d="M876 182 L876.0 247.0" stroke="#35677b" stroke-width="3" fill="none" /><polygon points="876.0,259.0 871.0,247.0 881.0,247.0" fill="#35677b"/><text x="984" y="221" fill="#173b4b" font-family="Arial,sans-serif" font-weight="bold" font-size="19" text-anchor="middle">PERMIT only</text><rect x="694" y="416" width="364" height="91" rx="11" fill="#e4f2e8" stroke="#35677b" stroke-width="2.5"/><text x="876" y="448" fill="#173b4b" font-family="Arial,sans-serif" font-weight="bold" font-size="22" text-anchor="middle">E6 controlled dispatch</text><text x="876" y="478" fill="#173b4b" font-family="Arial,sans-serif" font-weight="normal" font-size="19" text-anchor="middle">dispatch() claims E7 state first</text><path d="M876 350 L876.0 404.0" stroke="#35677b" stroke-width="3" fill="none" /><polygon points="876.0,416.0 871.0,404.0 881.0,404.0" fill="#35677b"/><rect x="694" y="565" width="364" height="89" rx="11" fill="#e4f2e8" stroke="#35677b" stroke-width="2.5"/><text x="876" y="598" fill="#173b4b" font-family="Arial,sans-serif" font-weight="bold" font-size="22" text-anchor="middle">Mock E8 provider truth</text><text x="876" y="625" fill="#173b4b" font-family="Arial,sans-serif" font-weight="normal" font-size="19" text-anchor="middle">External effect is simulated</text><path d="M876 507 L876.0 553.0" stroke="#35677b" stroke-width="3" fill="none" /><polygon points="876.0,565.0 871.0,553.0 881.0,553.0" fill="#35677b"/><text x="305" y="447" fill="#173b4b" font-family="Arial,sans-serif" font-weight="bold" font-size="20" text-anchor="middle">Authorization before preparation.</text><text x="305" y="478" fill="#173b4b" font-family="Arial,sans-serif" font-weight="bold" font-size="20" text-anchor="middle">Durable intent before provider effect.</text><text x="305" y="530" fill="#173b4b" font-family="Arial,sans-serif" font-weight="bold" font-size="20" text-anchor="middle">No client-to-adapter route.</text><text x="550" y="685" fill="#173b4b" font-family="Arial,sans-serif" font-weight="normal" font-size="18" text-anchor="middle">Separate OS process is not independently protected host isolation under a shared local UID.</text></svg>