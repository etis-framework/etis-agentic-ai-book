<svg baseProfile="full" height="435px" version="1.1" viewBox="0 0 900 435" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="435" width="900" x="0" y="0" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="bold" text-anchor="middle" x="450" y="43">Delegation changes the assurance burden</text><rect fill="#eef4f6" height="130" rx="13" ry="13" stroke="#9eb7c0" stroke-width="2" width="187" x="22" y="105" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="115.5" y="161.0">ASSIST</text><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" x="115.5" y="195.0">Human decides</text><rect fill="#eef4f6" height="130" rx="13" ry="13" stroke="#9eb7c0" stroke-width="2" width="187" x="245" y="105" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="338.5" y="161.0">AUTOMATE</text><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" x="338.5" y="195.0">Rules execute</text><rect fill="#eef4f6" height="130" rx="13" ry="13" stroke="#9eb7c0" stroke-width="2" width="187" x="468" y="105" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="561.5" y="161.0">ADAPT</text><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" x="561.5" y="195.0">Agent selects steps</text><rect fill="#eef4f6" height="130" rx="13" ry="13" stroke="#9eb7c0" stroke-width="2" width="187" x="691" y="105" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="784.5" y="161.0">COORDINATE</text><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" x="784.5" y="195.0">Durable ownership</text><line stroke="#255e72" stroke-dasharray="none" stroke-width="3" x1="65" x2="835" y1="295" y2="295" /><polygon fill="#255e72" points="835,295 822,288 822,302" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="450" y="344">Increasing discretion requires stronger scope, evidence, and recovery.</text><text fill="#255e72" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="450" y="397">A design spectrum—not a maturity ladder.</text></svg>