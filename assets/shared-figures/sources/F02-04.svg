<svg baseProfile="full" height="700px" version="1.1" viewBox="0 0 900 700" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="id1" markerHeight="11" markerWidth="11" markerUnits="userSpaceOnUse" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 z" fill="#255e72" /></marker></defs><rect fill="white" height="700" width="900" x="0" y="0" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" x="450" y="43">Bounded reasoning within durable enterprise controls</text><rect fill="#dcecf3" height="80" rx="12" ry="12" stroke="#9eb7c0" stroke-width="2" width="470" x="215" y="75" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="450.0" y="108.5">DURABLE CASE OWNER</text><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="450.0" y="137.5">Tracks status, escalation and recovery</text><polyline fill="none" marker-end="url(#id1)" points="450,155 450,191" stroke="#255e72" stroke-dasharray="none" stroke-linejoin="round" stroke-width="3" /><rect fill="#e4f3ee" height="80" rx="12" ry="12" stroke="#9eb7c0" stroke-width="2" width="470" x="215" y="194" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="450.0" y="227.5">BOUNDED AI</text><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="450.0" y="256.5">Investigates and proposes; cannot pay</text><polyline fill="none" marker-end="url(#id1)" points="450,274 450,310" stroke="#255e72" stroke-dasharray="none" stroke-linejoin="round" stroke-width="3" /><rect fill="#fbf1dc" height="80" rx="12" ry="12" stroke="#9eb7c0" stroke-width="2" width="470" x="215" y="313" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="450.0" y="346.5">TRUSTED EXECUTION</text><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="450.0" y="375.5">Checks authority; persists operation ID</text><polyline fill="none" marker-end="url(#id1)" points="450,393 450,429" stroke="#255e72" stroke-dasharray="none" stroke-linejoin="round" stroke-width="3" /><rect fill="#eef4f6" height="75" rx="12" ry="12" stroke="#9eb7c0" stroke-width="2" width="470" x="215" y="432" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="450.0" y="463.0">PAYMENT ADAPTER</text><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="450.0" y="492.0">Dispatches and queries the provider</text><rect fill="#e4f3ee" height="87" rx="12" ry="12" stroke="#9eb7c0" stroke-width="2" width="365" x="40" y="545" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="222.5" y="582.0">CONFIRMED OUTCOME</text><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="222.5" y="611.0">Record verified payment</text><rect fill="#f8e8e5" height="87" rx="12" ry="12" stroke="#9eb7c0" stroke-width="2" width="365" x="495" y="545" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="677.5" y="582.0">UNKNOWN OUTCOME</text><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="677.5" y="611.0">Reconcile before retry or closure</text><polyline fill="none" marker-end="url(#id1)" points="450,507 450,526 223,526 223,542" stroke="#255e72" stroke-dasharray="none" stroke-linejoin="round" stroke-width="3" /><polyline fill="none" marker-end="url(#id1)" points="450,507 450,526 677,526 677,542" stroke="#255e72" stroke-dasharray="8 6" stroke-linejoin="round" stroke-width="3" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="450" y="676">Two possible outcomes — never treat UNKNOWN as FAILED</text></svg>