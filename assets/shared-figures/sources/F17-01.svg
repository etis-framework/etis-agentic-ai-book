<text x="940" y="758" text-anchor="middle" fill="#203349" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">PILOT BOUNDED C</text>
<text x="940" y="789" text-anchor="middle" fill="#203349" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Read-only steps; stop limits</text>
