<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#172a3b} .head{font-weight:700;font-size:26px} .label{font-size:22px;font-weight:600} .small{font-size:19px} .tiny{font-size:17px} .line{fill:none;stroke:#315b78;stroke-width:3;stroke-linecap:round;stroke-linejoin:round} .dash{fill:none;stroke:#a65f28;stroke-width:3;stroke-dasharray:9,6} </style>
<rect width="1000" height="600" fill="#fff"/>
