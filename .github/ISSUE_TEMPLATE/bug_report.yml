name: Companion bug report
description: Reproducible defect in the educational code or repository docs
body:
  - type: markdown
    attributes:
      value: "Do not disclose vulnerabilities, tokens, credentials, or personal data here. See SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Release/tag or commit
      placeholder: v1.0.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps and expected vs observed behavior
      description: Include OS, Python version, exact command, and sanitized output.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact on documented teaching claim
