<text x="570" y="151" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#20384a">NORMATIVE AUTHORITY — E9 governance and accountable owners</text>
<text x="570" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#20384a">Approved ADR-021 • business rule • exception authority • release signoff</text>
<text x="570" y="212" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20384a">Policy source, owner, approved scope and revision</text>
