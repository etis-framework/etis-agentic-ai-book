<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#255b83"/></marker></defs><style>.h{font: bold 19px DejaVu Sans,sans-serif;fill:#172d43}.s{font: 16px DejaVu Sans,sans-serif;fill:#172d43}.t{font:bold 24px DejaVu Sans,sans-serif;fill:#172d43}.note{font:italic 15px DejaVu Sans,sans-serif;fill:#172d43}</style><rect width="1000" height="600" fill="#fff"/><text x="35" y="45" text-anchor="start" class="t">F33-01  Governed release architecture</text><text x="40" y="91" text-anchor="start" class="s">Different authorities; evidence is not permission</text><rect x="36" y="126" width="278" height="115" rx="12" fill="#e9f1f5" stroke="#172d43" stroke-width="2"/><text x="175.0" y="156" text-anchor="middle" class="h">Release candidate</text><text x="175.0" y="180" text-anchor="middle" class="s">model / tools / policy / code</text><rect x="361" y="126" width="278" height="115" rx="12" fill="#e9f1f5" stroke="#172d43" stroke-width="2"/><text x="500.0" y="156" text-anchor="middle" class="h">Assurance evidence</text><text x="500.0" y="180" text-anchor="middle" class="s">tests / falsifiers / gaps</text><rect x="684" y="126" width="280" height="115" rx="12" fill="#e5f2e8" stroke="#172d43" stroke-width="2"/><text x="824.0" y="156" text-anchor="middle" class="h">Human release gate</text><text x="824.0" y="180" text-anchor="middle" class="s">named scope and stop owner</text><path d="M 314 181 L 357 181" fill="none" stroke="#255b83" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 639 181 L 680 181" fill="none" stroke="#255b83" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="313" width="276" height="103" rx="12" fill="#e9f1f5" stroke="#172d43" stroke-width="2"/><text x="178.0" y="343" text-anchor="middle" class="h">E3/E4: bounded advice</text><text x="178.0" y="367" text-anchor="middle" class="s">C04 proposal — untrusted</text><rect x="365" y="313" width="272" height="103" rx="12" fill="#e5f2e8" stroke="#172d43" stroke-width="2"/><text x="501.0" y="343" text-anchor="middle" class="h">E5: trusted execution</text><text x="501.0" y="367" text-anchor="middle" class="s">C05 independent financial grant</text><rect x="687" y="313" width="275" height="103" rx="12" fill="#fff2dc" stroke="#172d43" stroke-width="2"/><text x="824.5" y="343" text-anchor="middle" class="h">E6/E8: external effect</text><text x="824.5" y="367" text-anchor="middle" class="s">C07; original RF-1042</text><path d="M 316 365 L 361 365" fill="none" stroke="#255b83" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 637 365 L 683 365" fill="none" stroke="#255b83" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 820 241 L 820 309" fill="none" stroke="#255b83" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="830" y="279" text-anchor="start" class="note">enable only</text><rect x="211" y="474" width="577" height="70" rx="12" fill="#faeeee" stroke="#172d43" stroke-width="2"/><text x="499.5" y="504" text-anchor="middle" class="h">E7 durability + C08 status-only inquiry</text><text x="499.5" y="528" text-anchor="middle" class="s">Unknown effect stays UNKNOWN; no replay</text><path d="M 500 416 L 500 468" fill="none" stroke="#255b83" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="40" y="579" text-anchor="start" class="note">E9 protects release decisions and audit; deployment alone never grants financial authority</text></svg>