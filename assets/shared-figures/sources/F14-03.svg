<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="4.691in" version="1.1" viewBox="0 0 1140 930" width="5.75in" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="930" width="1140" x="0" y="0" /><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="bold" text-anchor="middle" x="570" y="45">Reconcile by evidence, not by optimistic retry</text><rect fill="#FFF0CF" height="90" rx="14" ry="14" stroke="#203958" stroke-width="3" width="700" x="220" y="94" /><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="570.0" y="131.0">UNKNOWN · RF-1042</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="570.0" y="163.0">Query provider using original identity</text><rect fill="#EAF2FA" height="95" rx="14" ry="14" stroke="#203958" stroke-width="3" width="700" x="220" y="244" /><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="570.0" y="283.5">MATCHED PROVIDER RECORD?</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="570.0" y="315.5">Verify merchant, charge, amount, status</text><line fill="none" stroke="#203958" stroke-width="4" x1="570" x2="570" y1="185" y2="232" /><polygon fill="#203958" points="570,232 561,218 579,218" /><rect fill="#E4F3EE" height="103" rx="14" ry="14" stroke="#203958" stroke-width="3" width="460" x="40" y="424" /><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="270.0" y="467.5">YES · VERIFY COMPLETION</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="270.0" y="499.5">Contract says effect established</text><rect fill="#FFF0CF" height="103" rx="14" ry="14" stroke="#203958" stroke-width="3" width="460" x="640" y="424" /><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="870.0" y="467.5">NO / AMBIGUOUS / LAG</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="870.0" y="499.5">Keep UNKNOWN, investigate</text><line fill="none" stroke="#203958" stroke-width="4" x1="400" x2="270" y1="340" y2="412" /><polygon fill="#203958" points="270,412 284,403 284,421" /><line fill="none" stroke="#203958" stroke-width="4" x1="740" x2="870" y1="340" y2="412" /><polygon fill="#203958" points="870,412 856,403 856,421" /><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="238" y="384">matching evidence</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="899" y="384">not conclusive</text><rect fill="#E4F3EE" height="102" rx="14" ry="14" stroke="#203958" stroke-width="3" width="460" x="40" y="632" /><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="270.0" y="675.0">CONFIRMED</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="270.0" y="707.0">Persist evidence + provider ID</text><rect fill="#FCE7E5" height="102" rx="14" ry="14" stroke="#203958" stroke-width="3" width="460" x="640" y="632" /><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="870.0" y="675.0">HUMAN EXCEPTION REVIEW</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="870.0" y="707.0">No blind replay or new key</text><line fill="none" stroke="#203958" stroke-width="4" x1="270" x2="270" y1="528" y2="620" /><polygon fill="#203958" points="270,620 261,606 279,606" /><line fill="none" stroke="#203958" stroke-width="4" x1="870" x2="870" y1="528" y2="620" /><polygon fill="#203958" points="870,620 861,606 879,606" /><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="570" y="833">A provider NOT_FOUND is not necessarily final</text><text fill="#1A304A" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="570" y="877">Only provider-guaranteed non-effect can justify safe replay</text></svg>