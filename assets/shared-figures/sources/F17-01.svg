<text x="210" y="760" text-anchor="middle" fill="#203349" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">KEEP ADVISORY B</text>
<text x="210" y="790" text-anchor="middle" fill="#203349" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">or deterministic A</text>
