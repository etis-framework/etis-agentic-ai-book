<rect x="90" y="275" width="960" height="106" rx="11" fill="#edf1f5" stroke="#59748b" stroke-width="2"/>
<text x="570" y="309" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#20384a">VERSIONED EVALUATION — governed policy engine</text>
<text x="570" y="341" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#20384a">POL-021 + version/digest • actor • tenant • $500 • case • epoch</text>
<text x="570" y="367" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20384a">Decision: permit / deny / governed review  +  evidence reference</text>
