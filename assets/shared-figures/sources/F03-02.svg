<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="656px" version="1.1" viewBox="0 0 900 656" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="id3" markerHeight="11" markerWidth="11" markerUnits="userSpaceOnUse" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 z" fill="#255e72" /></marker></defs><rect fill="white" height="656" width="900" x="0" y="0" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" x="450" y="43">Allocate responsibility; do not confuse it with a workflow</text><rect fill="#dcecf3" height="73" rx="12" ry="12" stroke="#9eb7c0" stroke-width="2" width="790" x="55" y="91" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="85" y="135">PROCESS RESPONSIBILITY</text><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="505" y="135">POSSIBLE ALLOCATION</text><rect fill="#eef4f6" height="84" rx="12" ry="12" stroke="#9eb7c0" stroke-width="2" width="790" x="55" y="178" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" x="85" y="229">Acquire information</text><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" text-anchor="start" x="505" y="229">Automated retrieval</text><rect fill="#e4f3ee" height="84" rx="12" ry="12" stroke="#9eb7c0" stroke-width="2" width="790" x="55" y="276" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" x="85" y="327">Analyze evidence</text><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" text-anchor="start" x="505" y="327">Model-assisted summary</text><rect fill="#eef4f6" height="84" rx="12" ry="12" stroke="#9eb7c0" stroke-width="2" width="790" x="55" y="374" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" x="85" y="425">Select remedy</text><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" text-anchor="start" x="505" y="425">Human or approved rules</text><rect fill="#e4f3ee" height="84" rx="12" ry="12" stroke="#9eb7c0" stroke-width="2" width="790" x="55" y="472" /><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" x="85" y="523">Implement action</text><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" text-anchor="start" x="505" y="523">Trusted execution service</text><text fill="#203c4d" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="450" y="629">Allocations are independent design choices, not sequential handoffs</text></svg>