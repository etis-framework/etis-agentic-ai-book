<rect x="15" y="192" width="169" height="90" rx="14" fill="#ffe3e0" stroke="#426b86" stroke-width="2"/>
<text class="label" x="100" y="229" text-anchor="middle">NO</text>
<text class="label" x="100" y="255" text-anchor="middle">BLOCK</text>
<text class="small" x="235" y="209" text-anchor="middle">No</text>
