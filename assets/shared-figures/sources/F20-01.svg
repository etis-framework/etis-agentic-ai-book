<text x="941" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20384a">Owner epoch • accepted tasks</text>
<text x="941" y="341" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20384a">Intent • UNKNOWN observations</text>
<text x="941" y="373" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20384a">Trusted, fenced transitions</text>

