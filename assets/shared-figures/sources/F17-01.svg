<text x="570" y="43" text-anchor="middle" fill="#12243A" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Choose the simplest sufficient design</text>
<text x="570" y="78" text-anchor="middle" fill="#415164" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Pattern selection is not consequential authorization</text>
